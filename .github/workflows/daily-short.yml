name: Autonomous Science Short

on:
  schedule:
    - cron: '0 10 * * *'          # daily 10:00 UTC
  workflow_dispatch:               # manual trigger for testing

concurrency:
  group: shorts-pipeline
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write               # for state commits
      actions: write                # for keepalive

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: '.github/requirements.txt'

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu

      - name: Install Python deps
        run: pip install -r .github/requirements.txt

      # ── KEEPALIVE: prevents 60-day auto-disable ──
      - name: Keep workflow alive
        if: github.event_name == 'schedule'
        uses: liskin/gh-workflow-keepalive@v1
        with:
          GITHUB_TOKEN: ${{ secrets.KEEPALIVE_TOKEN }}

      # ── MAIN PIPELINE ──
      - name: Run pipeline
        env:
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY:       ${{ secrets.GROQ_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          DISCORD_WEBHOOK:    ${{ secrets.DISCORD_WEBHOOK }}
        run: python -u scripts/orchestrator.py

      # ── STATE PERSISTENCE ──
      - name: Commit state
        if: always()
        run: |
          git config user.name "shorts-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/
          git diff --staged --quiet || git commit -m "state update [skip ci]"
          git push || echo "nothing to push"

      # ── FAILURE ALERT ──
      - name: Notify on failure
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "$DISCORD_WEBHOOK" ]; then
            curl -s -X POST "$DISCORD_WEBHOOK" \
              -H "Content-Type: application/json" \
              -d "{\"content\":\"🚨 Pipeline failed: $RUN_URL\"}"
          fi